<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#061827">
<meta name="description" content="کارت ویزیت دیجیتال مجید شیروانی - شیروان فیلم">
<title>مجید شیروانی | شیروان فیلم</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#020b13;color:#fff;font-family:Tahoma,Arial,sans-serif}
.wrap{min-height:100vh;display:flex;justify-content:center;padding:24px 14px}
.card{width:min(470px,100%);background:linear-gradient(180deg,#061a2a,#03101a 72%,#021019);border:1px solid #0c5570;border-radius:28px;overflow:hidden;box-shadow:0 20px 70px #0009;position:relative}
.film{height:8px;background:linear-gradient(90deg,#00d9ff,#1685ad,#00d9ff)}
.top{text-align:center;padding:34px 22px 22px}
.logo{width:210px;max-width:75%;height:210px;object-fit:contain;filter:drop-shadow(0 8px 20px #0008)}
.brand{font-size:34px;font-weight:800;letter-spacing:.3px;margin-top:5px}
.brand-fa{font-size:22px;color:#9fd9e7;margin-top:8px}
.line{width:100px;height:2px;background:#00cfe8;margin:17px auto}
.name{font-size:29px;font-weight:800;margin-top:18px}
.role{font-size:17px;color:#b8c8d0;margin-top:8px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 18px 22px}
.btn{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;background:#071f30;border:1px solid #0a6481;border-radius:17px;padding:15px 13px;min-height:66px;transition:.2s}
.btn:hover{transform:translateY(-2px);background:#0a2b40}
.icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#0aa6d2;font-size:22px;flex:none}
.label{font-size:13px;color:#9db6c0}
.value{font-size:14px;font-weight:700;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis}
.save{grid-column:1/-1;justify-content:center;background:linear-gradient(90deg,#0b6f8b,#087e9b);border-color:#16c9e8}
.save .value{font-size:16px}
.footer{text-align:center;padding:4px 20px 28px;color:#8eaab4;font-size:14px}
.footer b{color:#d7eef4}
@media(max-width:390px){.buttons{grid-template-columns:1fr}.name{font-size:25px}.brand{font-size:30px}.logo{height:175px}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="film"></div>
<section class="top">
<img class="logo" src="shirvan-film-logo.png" alt="Shirvan Film">
<div class="brand">Shirvan Film</div>
<div class="brand-fa">شیروان فیلم</div>
<div class="line"></div>
<div class="name">مجید شیروانی</div>
<div class="role">مدیریت شیروان فیلم</div>
</section>

<section class="buttons">
<a class="btn" href="tel:+989111287932"><span class="icon">☎</span><span><div class="label">تماس مستقیم</div><div class="value">09111287932</div></span></a>
<a class="btn" href="https://instagram.com/majid.shirvaniii" target="_blank"><span class="icon">◎</span><span><div class="label">اینستاگرام</div><div class="value">@majid.shirvaniii</div></span></a>
<a class="btn" href="https://t.me/Shirvanfilm" target="_blank"><span class="icon">✈</span><span><div class="label">تلگرام</div><div class="value">t.me/Shirvanfilm</div></span></a>
<a class="btn save" href="contact.vcf"><span class="icon">＋</span><span><div class="value">ذخیره شماره در مخاطبین</div></span></a>
</section>

<div class="footer">تصویر، روایت، احساس<br><b>Shirvan Film</b></div>
</div>
</div>
</body>
</html>
